<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task</title>
    {% load tailwind_tags %}
    {% load static %}
    {% tailwind_css %}
</head>
<body class="antialiased">
    <div class="min-h-screen bg-cover bg-center bg-no-repeat flex flex-col items-center justify-center relative" style="background-image: url('{% static "todolist/media/bcg.jpg" %}')">
       <div class="absolute inset-0 bg-black/40"></div>
       <div class="relative z-10 w-full max-w-md p-8 bg-white/90 backdrop-blur-sm rounded-2xl shadow-2xl">

        <h1 class="text-4xl font-bold mb-4 text-gray-800 text-center">Add a New Task</h1>

        <form action="{% url "add" %}" method='post' class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="{{ forms.task.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">Add new tasks</label>
                 <div class=" [&>input=]:m-3 [&>input=]:text-grey-300 [&>input=]:border [&>input=]:border-gray-300 [&>input=]:rounded-md [&>input]:w-full">
                {{ forms.task }}
                </div>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:shadow-lg transition">Add Task</button>
            </div>
        </form>

        <a href="{% url "tasks" %}" class="block text-center mt-4 text-blue-600 hover:text-blue-800">Show tasks</a>
    </div>
    </div>
</body>
</html>
