{% load tailwind_tags %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo list</title>
    {% tailwind_css %}
    

</head>
<body class="antialiased">
    <div class="min-h-screen bg-cover bg-center bg-no-repeat flex flex-col items-center justify-center relative" style="background-image: url('{% static "todolist/media/bcg.jpg" %}')">
       <div class="absolute inset-0 bg-black/40"></div>
       <div class="relative z-10 w-full max-w-md p-8 bg-white/90 backdrop-blur-sm rounded-2xl shadow-2xl">

        <h1 class="text-4xl font-bold mb-4 text-gray-800 text-center">Todo List</h1>


    <ol class="space-y-3 mb-6">

    {% for task in tasks %}
     <li class="p3 bg-white/50 rounded-lg border text-black border-gray-700 shadow-sm">{{task}}</li>
    
    {% endfor %}
    </ol>
    <a href="{% url "add" %}" class="block text-center bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:shadow-lg transition shadow-md">Add a new task</a>
</div>
</div>
</body>
</html>
